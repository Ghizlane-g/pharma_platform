services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pharma_frontend

    ports:
      - "8000:8000"

    volumes:
      - ./frontend:/app

    environment:
      - PYTHONUNBUFFERED=1

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - backend


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pharma_backend

    ports:
      - "8001:8001"

    volumes:
      - ./backend:/app

    environment:
      - PYTHONUNBUFFERED=1

    command: python manage.py runserver 0.0.0.0:8001