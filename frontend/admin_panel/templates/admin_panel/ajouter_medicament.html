<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Ajouter un médicament</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            background: white;
            padding: 35px;
            width: 420px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Ajouter un médicament</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Nom :</label>
        <input type="text" name="nom" required>

        <br><br>

        <label>Classe</label>
        <textarea name="classe" required></textarea>

        <br><br>

        <label>Prix :</label>
        <input type="number" name="prix" step="0.01" min="0" required>

        <br><br>

        <label>Statut :</label>
        <select name="statut">
            <option value="DISPONIBLE">Disponible</option>
            <option value="NON_DISPONIBLE">Non disponible</option>
        </select>

        <br><br>

        <button type="submit">
            Ajouter le médicament
        </button>

    </form>

    <a class="back" href="{% url 'medicaments' %}">
        ← Retour aux médicaments
    </a>

</div>

</body>

</html>
