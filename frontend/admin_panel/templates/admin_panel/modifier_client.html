<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Modifier un client</title>
</head>

<body>

    <h1>Modifier le client</h1>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Username :</label>
        <input
            type="text"
            name="username"
            value="{{ client.username }}"
            required
        >

        <br><br>

        <label>Email :</label>
        <input
            type="email"
            name="email"
            value="{{ client.email }}"
            required
        >

        <br><br>

        <button type="submit">
            Enregistrer
        </button>

    </form>

    <br>

    <a href="{% url 'clients' %}">
        ← Retour aux clients
    </a>

</body>

</html>
