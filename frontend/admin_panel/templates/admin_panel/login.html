<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .login-container {
            width: 400px;
            padding: 35px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        /* LOGO */
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 380px;
            height: auto;
            max-height: 230px;
            object-fit: contain;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: normal;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: rgb(6, 158, 102);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            background-color: #5ebc67;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1cc88a;
        }

        .error {
            margin-bottom: 18px;
            padding: 10px;
            background-color: #fee2e2;
            color: #b91c1c;
            border-radius: 6px;
        }

    </style>

</head>

<body>

<div class="login-container">

    {% load static %}

    <div class="logo-container">

        <img
            src="{% static 'images/logopharma.png' %}"
            alt="Logo Pharma"
            class="logo"
        >

    </div>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label>Username :</label>

            <input
                type="text"
                name="username"
                value="{{ username|default:'' }}"
                required
            >

        </div>

        <div class="form-group">

            <label>Password :</label>

            <input
                type="password"
                name="password"
                required
            >

        </div>

        <button type="submit">
            Se connecter
        </button>

    </form>

</div>

</body>

</html>
