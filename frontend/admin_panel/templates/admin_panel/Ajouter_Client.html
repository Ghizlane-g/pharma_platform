<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Ajouter un client</title>


<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    .container {
        background-color: white;
        padding: 35px;
        width: 400px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        background-color: #007bff;
        color: white;
    }

    button:hover {
        background-color: #0056b3;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        text-decoration: none;
    }

    .error {
        color: red;
        text-align: center;
        margin-bottom: 15px;
    }
</style>

</head>

<body>

<div class="container">

    <h1>Ajouter un client</h1>

    {% if error %}
        <p class="error">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Username :</label>
        <input type="text" name="username" required>

        <br><br>

        <label>Email :</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Mot de passe :</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">
            Ajouter le client
        </button>

    </form>

    <a class="back" href="{% url 'clients' %}">
        ← Retour aux clients
    </a>

</div>


</body>

</html>
