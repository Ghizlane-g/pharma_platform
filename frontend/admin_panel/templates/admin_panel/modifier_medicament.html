<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Modifier un médicament</title>
</head>

<body>

    <h1>Modifier le médicament</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Nom :</label>
        <input
            type="text"
            name="nom"
            value="{{ medicament.nom }}"
            required
        >

        <br><br>

        <label>Classe :</label>
        <textarea
            name="classe"
            required
        >{{ medicament.classe}}</textarea>

        <br><br>

        <label>Prix :</label>
        <input
            type="number"
            name="prix"
            step="0.01"
            value="{{ medicament.prix }}"
            required
        >

        <br><br>
        <label>Statut :</label>

        <select name="statut" required>

            <option value="DISPONIBLE"
                {% if medicament.statut == "DISPONIBLE" %}selected{% endif %}>
                Disponible
            </option>

            <option value="NON_DISPONIBLE"
                {% if medicament.statut == "NON_DISPONIBLE" %}selected{% endif %}>
                Non disponible
            </option>

        </select>
        <button type="submit">
            Enregistrer les modifications
        </button>

    </form>

    <br>

    <a href="{% url 'medicaments' %}">
        ← Retour aux médicaments
    </a>

</body>

</html>
